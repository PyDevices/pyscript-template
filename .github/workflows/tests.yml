name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Vendor PyScript
        run: ./scripts/vendor_pyscript.sh

      - name: Run tests
        run: python3 -m unittest discover -s tests -v
